name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build disk image
        run: ./scripts/build-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleMacEQ
          path: build/SimpleMacEQ.dmg

      # Pushing a tag like v0.1.0 publishes a GitHub release with the .dmg.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/SimpleMacEQ.dmg --title "$GITHUB_REF_NAME" --generate-notes
