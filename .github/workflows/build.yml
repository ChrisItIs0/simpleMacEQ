name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Package
        run: ditto -c -k --keepParent build/SimpleMacEQ.app SimpleMacEQ.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleMacEQ
          path: SimpleMacEQ.zip
